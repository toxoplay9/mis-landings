<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Productos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    p { color: #888; margin-bottom: 2rem; }
    ul { list-style: none; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    a { display: block; padding: 1rem 2rem; background: #1a1a1a; border-radius: 12px; color: #fff; text-decoration: none; border: 1px solid #333; transition: 0.2s; }
    a:hover { background: #222; border-color: #555; }
  </style>
</head>
<body>
  <h1>Mis Productos</h1>
  <p>Selecciona un producto para ver más información</p>
  <ul>
    <li><a href="producto1/">Producto 1</a></li>
    <li><a href="producto2/">Producto 2</a></li>
  </ul>
</body>
</html>
